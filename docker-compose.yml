services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-kopano}
      POSTGRES_USER: ${DB_USER:-kopano}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kopano123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./init.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kopano} -d ${DB_NAME:-kopano}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Dev-only publish. Production compose does not publish 5432.
    ports:
      - "${DB_PORT:-5432}:5432"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DATABASE_URL: postgres://${DB_USER:-kopano}:${DB_PASSWORD:-kopano123}@postgres:5432/${DB_NAME:-kopano}
      JWT_SECRET: ${JWT_SECRET:-kopano-dev-only-secret-do-not-use-in-prod-32c}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:3000}
      PAYMENT_SANDBOX_AUTO_COMPLETE: ${PAYMENT_SANDBOX_AUTO_COMPLETE:-false}
      OM_MERCHANT_ID: ${OM_MERCHANT_ID:-}
      OM_MERCHANT_KEY: ${OM_MERCHANT_KEY:-}
      OM_CLIENT_ID: ${OM_CLIENT_ID:-}
      OM_CLIENT_SECRET: ${OM_CLIENT_SECRET:-}
      OM_WEBHOOK_SECRET: ${OM_WEBHOOK_SECRET:-}
      OM_ENV: ${OM_ENV:-sandbox}
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - api
    profiles: ["dev"]

volumes:
  postgres_data:
  frontend_node_modules:
