# Production overlay — no bind mounts, no published Postgres, built frontend
services:
  postgres:
    ports: []
    restart: always

  api:
    restart: always
    environment:
      NODE_ENV: production
    read_only: false

  frontend:
    profiles: []
    image: null
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    working_dir: /usr/share/nginx/html
    volumes: []
    command: []
    environment:
      API_UPSTREAM: http://api:3000
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
